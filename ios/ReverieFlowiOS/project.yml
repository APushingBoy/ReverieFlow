name: ReverieFlowiOS
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.reverieflow.ios
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: 1,2
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
configs:
  Debug: debug
  Release: release
targets:
  ReverieFlowApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/MainApp
      - path: Sources/Shared
      - path: Resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: ReverieFlow
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: false
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ReverieFlow 需要麦克风权限进行语音输入。
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.reverieflow.ios
            CFBundleURLSchemes:
              - reverieflow
        INFOPLIST_KEY_LSApplicationQueriesSchemes:
          - reverieflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.reverieflow.ios.app
        PRODUCT_NAME: ReverieFlow
        CODE_SIGN_ENTITLEMENTS: App/ReverieFlowApp.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: ReverieFlowKeyboard
  ReverieFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/KeyboardExtension
      - path: Sources/Shared
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: ReverieFlow Keyboard
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ReverieFlow Keyboard 需要麦克风权限进行语音输入。
        PRODUCT_BUNDLE_IDENTIFIER: com.reverieflow.ios.keyboard
        PRODUCT_NAME: ReverieFlowKeyboard
        CODE_SIGN_ENTITLEMENTS: App/ReverieFlowKeyboard.entitlements
